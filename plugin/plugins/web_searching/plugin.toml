[plugin]
name = "Web Searching"
description = "独立开发的联网搜索插件。注册为 LLM 工具。百度/Bing 为首选引擎（国内稳定），Jina/DDG 为 fallback。自动提取页面正文，去重+相关性排序。fetch_page_content 工具让猫娘可抓取任意 URL 正文。"
short_description = "Multi-engine web search (Baidu/Bing primary) + page content extraction."
keywords = ["搜索", "search", "联网", "web", "百度", "baidu", "网络", "internet", "查", "检索", "bing", "fetch", "抓取", "正文"]
version = "1.4.1"
id = "web_searching"
entry = "plugin.plugins.web_searching:WebSearchingPlugin"

[plugin.author]
name = "N.E.K.O Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[search]
max_results = 8
timeout_seconds = 25
