[plugin]
name = "Web Searching"
description = "独立开发的联网搜索插件。注册为 LLM 工具。Jina Search/Reader（免费，支持JS渲染）首选，百度/Bing/DDG fallback。搜狗降权（相对路径问题）。自动解析跳转链接获取真实URL，搜索重试机制，改进摘要提取。fetch_page_content 工具可抓取任意URL正文。"
short_description = "Jina-powered web search + redirect resolution + retry. Supports JS rendering. Free, no API key."
keywords = ["搜索", "search", "联网", "web", "jina", "百度", "baidu", "网络", "internet", "查", "检索", "duckduckgo", "bing", "fetch", "抓取", "正文"]
version = "1.5.0"
id = "web_searching"
entry = "plugin.plugins.web_searching:WebSearchingPlugin"

[plugin.author]
name = "N.E.K.O Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[search]
max_results = 8
timeout_seconds = 25
