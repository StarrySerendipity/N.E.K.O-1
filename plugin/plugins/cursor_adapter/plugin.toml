[plugin]
name = "Cursor Adapter"
type = "plugin"
description = "通过 @llm_tool 将 Cursor Agent CLI 注册为猫娘可调用的工具集。猫娘可以直接调用 Cursor 执行项目开发任务：写代码、改 bug、跑测试、查文档。支持会话恢复（session_id）、流式输出解析、成本追踪和瞬态错误自动重试。"
short_description = "Expose Cursor Agent CLI as catgirl-callable LLM tools. Run Cursor tasks from the main project."
keywords = [
    "cursor",
    "agent",
    "cli",
    "coding",
    "developer",
    "llm_tool",
    "adapter",
    "catgirl",
    "猫娘",
]

version = "0.1.0"
id = "cursor_adapter"
entry = "plugins.cursor_adapter:CursorAdapterPlugin"

[plugin.author]
name = "N.E.K.O Community"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin_state]
backend = "file"
persist_mode = "auto"

# 启用 PluginStore（SQLite KV 存储），用于持久化会话记录
[plugin.store]
enabled = true

# ---------------------------------------------------------------------------
# Cursor Adapter 配置
# 参考 paperclip/packages/adapters/cursor-local 的 agentConfigurationDoc
# ---------------------------------------------------------------------------
[cursor]
# Cursor Agent CLI 可执行文件路径。留空则自动检测（PATH 上的 agent / cursor-agent）。
# Windows 上若 agent 不在 PATH，可填绝对路径。
# 官方 Windows 安装：irm 'https://cursor.com/install?win32=true' | iex
# 安装后通常在 C:/Users/<user>/AppData/Local/cursor-agent/agent.cmd
command = ""
# 默认模型 ID（留空使用 Cursor CLI 默认值，通常为 auto）。
# 已知模型：auto / composer-1.5 / composer-1 / gpt-5.3-codex / gpt-5.3-codex-low /
#           gpt-5.3-codex-high / gpt-5.2 / gpt-5.2-codex / opus-4.6 / sonnet-4.6 /
#           gemini-3.1-pro / gemini-3-pro / grok / kimi-k2.5 等。
model = ""
# 执行模式（可选）："" | "agent" | "build" | "ask" | "browse" 等。留空使用默认。
mode = ""
# 绕过交互式确认（--yolo 参数）。
#
# 重要：本插件设计用于非交互式环境（通过 @llm_tool 调用，stdin 是管道）。
# 如果设置为 false，Cursor Agent 在执行敏感操作时会要求用户确认，导致：
# - 执行挂起等待用户输入（但无交互界面）
# - 最终超时失败
# - 无法保存 session_id，破坏会话连续性
#
# 因此默认值为 true，确保在非交互式环境中正常工作。
# 安全风险：启用后 Cursor 将跳过所有安全审批，可能执行任意文件操作和命令。
# 仅在受信任的环境中使用本插件。
yolo = true
# 单次执行超时（秒）。main_server LLM 工具上限 300s。
timeout_sec = 300
# 默认工作目录（留空 = 当前插件进程 cwd）。猫娘调用时可覆盖。
cwd = ""
# 指令文件路径（markdown）。内容会前置到 stdin 提示。
instructions_file_path = ""
# 失败后自动重试新会话的次数。
max_retries = 1
# 额外 CLI 参数（JSON 数组字符串，如 "[\"--verbose\"]"）。
extra_args = "[]"
