[plugin]
name = "猫娘邮件秘书"
description = "让猫娘帮你管理QQ邮箱,生成邮件摘要、判断优先级、标记已读、发送邮件。清新诗意的前端界面,支持i18n多语言。"
short_description = "Catgirl mail secretary — QQ mailbox summaries, priority classification, mark read, and send emails."
keywords = ["邮件", "邮箱", "email", "mail", "QQ邮箱", "IMAP", "SMTP", "摘要", "猫娘", "メール", "메일", "почта", "correo"]
version = "0.1.0"
id = "neko_mail"
entry = "plugin.plugins.neko_mail:NekoMailPluginEntry"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = false

[neko_mail]
# QQ 邮箱地址
email_addr = "2987293848@qq.com"
# QQ 邮箱授权码(16位,在 QQ 邮箱设置中生成)
auth_code = "fgbnvkwbqtlzdcjg"
# IMAP 服务器
imap_server = "imap.qq.com"
imap_port = 993
# SMTP 服务器
smtp_server = "smtp.qq.com"
smtp_port = 465
# 高优先级发件人(逗号分隔,匹配发件人地址中的任意子串)
high_priority_senders = ""
# 要忽略的文件夹(逗号分隔)
ignore_folders = ""
