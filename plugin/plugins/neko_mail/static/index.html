<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📧 猫娘邮件秘书</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink: #ff8db4;
    --pink-deep: #e86ba0;
    --blue: #7ec8e3;
    --blue-deep: #5ab0d4;
    --peach: #ffb88c;
    --pink-soft: #ffe4ec;
    --blue-soft: #e6f4f9;
    --peach-soft: #fff5e6;
    --ink: #3d2f2f;
    --ink-soft: #7a5e5e;
    --ink-muted: #b89a9a;
    --line: #ffd1e0;
    --line-soft: #ffe8f0;
    --bg: linear-gradient(135deg, #ffe4ec 0%, #e6f4f9 50%, #fff5e6 100%);
    --card: rgba(255, 255, 255, 0.82);
    --card-solid: #ffffff;
    --accent: #d4638a;
    --accent-soft: #f4a9c8;
    --good: #6bc48a;
    --warn: #f0a23a;
    --bad: #ef5d5d;
    --shadow: 0 6px 24px rgba(212, 99, 138, 0.12);
    --shadow-lg: 0 14px 44px rgba(212, 99, 138, 0.22);
    --radius: 18px;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 24px 60px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  /* ── Header ── */
  .header {
    position: relative;
    padding: 22px 26px 20px;
    background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(230,244,249,0.82));
    border-radius: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .header::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,141,180,0.25), transparent 70%);
    pointer-events: none;
  }
  .header::after {
    content: ''; position: absolute; bottom: -60px; left: -30px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(126,200,227,0.22), transparent 70%);
    pointer-events: none;
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; position: relative; z-index: 1;
  }
  .header h1 {
    font-size: 26px; display: flex; align-items: center; gap: 12px;
    font-weight: 700; letter-spacing: 0.3px;
  }
  .header h1 .emoji { font-size: 28px; }
  .header h1 .badge {
    font-size: 12px; color: white; font-weight: 700;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    padding: 4px 12px; border-radius: 999px;
    min-width: 28px; text-align: center;
    box-shadow: 0 4px 12px rgba(255,141,180,0.35);
    letter-spacing: 0.5px;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .header-actions button { padding: 8px 14px; font-size: 12px; }
  .greeting {
    color: var(--ink-soft); font-size: 13px;
    margin-top: 10px; position: relative; z-index: 1;
    font-style: italic;
  }
  .status-bar {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 2px 8px rgba(212,99,138,0.1);
    margin-top: 12px; position: relative; z-index: 1;
    border: 1px solid rgba(255,209,224,0.5);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 8px rgba(107,196,138,0.6);
    animation: pulse 2s infinite;
  }
  .status-dot.error { background: var(--bad); box-shadow: 0 0 8px rgba(239,93,93,0.6); }
  .status-dot.loading { background: var(--warn); box-shadow: 0 0 8px rgba(240,162,58,0.6); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 4px; flex-wrap: wrap;
    background: var(--card);
    border-radius: 18px; padding: 7px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .tab {
    cursor: pointer; padding: 10px 18px;
    border-radius: 13px; font-size: 13px; font-weight: 600;
    color: var(--ink-soft);
    transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    display: flex; align-items: center; gap: 6px;
    position: relative;
  }
  .tab .tab-count {
    font-size: 11px; background: var(--pink-soft); color: var(--accent);
    padding: 2px 8px; border-radius: 999px; font-weight: 700;
    min-width: 20px; text-align: center;
  }
  .tab:hover { background: var(--pink-soft); color: var(--accent); }
  .tab.active {
    background: linear-gradient(135deg, var(--pink), var(--blue));
    color: white;
    box-shadow: 0 6px 16px rgba(255,141,180,0.38);
  }
  .tab.active .tab-count {
    background: rgba(255,255,255,0.28); color: white;
  }

  /* ── Panels ── */
  .panel {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.55);
    backdrop-filter: blur(6px);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .panel-head h3 {
    margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px;
    font-weight: 700; color: var(--ink);
  }
  .panel-head .hint { font-size: 12px; color: var(--ink-soft); font-weight: 500; }

  /* ── Stats Grid ── */
  .stats-grid {
    display: grid; gap: 14px; margin-bottom: 22px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .stat {
    background: var(--card-solid);
    border-radius: 18px; padding: 18px 20px;
    box-shadow: var(--shadow);
    position: relative; overflow: hidden;
    transition: transform 0.25s, box-shadow 0.25s;
    border: 1px solid rgba(255,255,255,0.7);
  }
  .stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .stat::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 80px; height: 80px; border-radius: 50%;
    opacity: 0.12; transform: translate(25px, -25px);
  }
  .stat.pink::before { background: linear-gradient(135deg, var(--pink), var(--pink-deep)); }
  .stat.blue::before { background: linear-gradient(135deg, var(--blue), var(--blue-deep)); }
  .stat.warn::before { background: linear-gradient(135deg, var(--warn), #ff8844); }
  .stat.good::before { background: linear-gradient(135deg, var(--good), #4ec870); }
  .stat .num {
    font-size: 34px; font-weight: 800; line-height: 1.05;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .stat.warn .num {
    background: linear-gradient(135deg, var(--warn), #ff8844);
    -webkit-background-clip: text; background-clip: text;
  }
  .stat.good .num {
    background: linear-gradient(135deg, var(--good), #4ec870);
    -webkit-background-clip: text; background-clip: text;
  }
  .stat .lbl {
    font-size: 12px; color: var(--ink-soft);
    margin-top: 6px; font-weight: 600;
    letter-spacing: 0.3px;
  }

  /* ── Filter Bar ── */
  .filter-bar { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-chip {
    padding: 6px 15px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: var(--card-solid); color: var(--ink-soft);
    border: 1px solid var(--line-soft);
    cursor: pointer; user-select: none;
    transition: all 0.2s;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.on {
    background: linear-gradient(135deg, var(--pink), var(--blue));
    color: white; border-color: transparent;
    box-shadow: 0 4px 12px rgba(255,141,180,0.32);
  }

  /* ── Email List ── */
  .email-list { list-style: none; padding: 0; margin: 0; }
  .email-item {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 15px 17px; margin-bottom: 10px;
    background: var(--card-solid); border-radius: 15px;
    border-left: 4px solid var(--blue);
    transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.6);
    border-left: 4px solid var(--blue);
  }
  .email-item:hover {
    transform: translateX(3px);
    box-shadow: 0 6px 18px rgba(212,99,138,0.14);
    border-color: rgba(255,209,224,0.6);
  }
  .email-item.high { border-left-color: var(--bad); }
  .email-item.medium { border-left-color: var(--blue); }
  .email-item.low { border-left-color: #d8d0d0; }
  .email-item .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: white;
    flex-shrink: 0; text-transform: uppercase;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    letter-spacing: 0.5px;
  }
  .email-item .avatar.high { background: linear-gradient(135deg, #ff6b6b, #ff8e8e); }
  .email-item .avatar.medium { background: linear-gradient(135deg, var(--blue), #a0d8ef); }
  .email-item .avatar.low { background: linear-gradient(135deg, #b0b0b0, #d0d0d0); }
  .email-item .body { flex: 1; min-width: 0; }
  .email-item .body .title {
    font-weight: 600; word-break: break-word; font-size: 14px;
    display: flex; align-items: center; gap: 7px;
    color: var(--ink); line-height: 1.4;
  }
  .email-item .body .meta {
    font-size: 12px; color: var(--ink-soft); margin-top: 4px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .email-item .body .meta span { display: inline-flex; align-items: center; gap: 3px; }
  .email-item .body .preview {
    font-size: 12.5px; color: var(--ink-soft); margin-top: 7px; line-height: 1.65;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .email-item .actions { display: flex; gap: 5px; flex-shrink: 0; align-items: flex-start; }

  /* ── Tags ── */
  .tag {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.2px;
  }
  .tag.prio-high { background: #ffd6d6; color: #c44444; }
  .tag.prio-medium { background: #bee3f8; color: #2c5282; }
  .tag.prio-low { background: #ececec; color: #666; }
  .tag.attach { background: var(--peach-soft); color: #b07700; }

  /* ── Buttons ── */
  button {
    cursor: pointer; border: none; border-radius: 12px;
    padding: 9px 18px; font-size: 13px; font-weight: 600;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    color: white; transition: all 0.22s;
    font-family: inherit; letter-spacing: 0.3px;
    box-shadow: 0 3px 10px rgba(255,141,180,0.25);
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(255,141,180,0.4);
  }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  button.ghost {
    background: var(--pink-soft); color: var(--accent);
    box-shadow: none;
  }
  button.ghost:hover { background: #f4dde4; box-shadow: none; transform: none; }
  button.danger { background: var(--bad); box-shadow: 0 3px 10px rgba(239,93,93,0.3); }
  button.tiny { padding: 6px 13px; font-size: 12px; border-radius: 9px; }

  /* ── Form ── */
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 11px 15px;
    border: 1.5px solid var(--line-soft); border-radius: 12px;
    font-size: 14px; background: var(--card-solid);
    font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
    color: var(--ink);
  }
  .form-group input:focus, .form-group textarea:focus {
    outline: none; border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255,141,180,0.15);
  }
  .form-group textarea { min-height: 130px; resize: vertical; line-height: 1.6; }
  .form-row { display: flex; gap: 14px; }
  .form-row .form-group { flex: 1; }

  /* ── Empty / Loading ── */
  .empty {
    text-align: center; color: var(--ink-muted); padding: 50px 20px;
    font-size: 14px;
  }
  .empty .empty-icon {
    font-size: 52px; margin-bottom: 14px; display: block;
    filter: drop-shadow(0 4px 8px rgba(212,99,138,0.15));
  }
  .loading { text-align: center; padding: 50px; }
  .spinner {
    display: inline-block; width: 34px; height: 34px;
    border: 3px solid var(--line); border-top-color: var(--pink);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(61,47,47,0.95); color: white;
    padding: 12px 26px; border-radius: 28px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: all 0.3s;
    pointer-events: none; z-index: 200;
    box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: rgba(239,93,93,0.95); }
  .toast.success { background: rgba(107,196,138,0.95); }

  /* ── Modal ── */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(61,47,47,0.55);
    display: none; align-items: center; justify-content: center;
    z-index: 300; padding: 20px;
    backdrop-filter: blur(6px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: white; border-radius: 22px; padding: 26px;
    max-width: 640px; width: 100%;
    max-height: 82vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h3 {
    margin: 0 0 18px 0; font-size: 19px;
    display: flex; align-items: center; gap: 8px;
    color: var(--ink);
  }
  .modal .email-detail-meta {
    display: flex; flex-direction: column; gap: 9px;
    padding: 15px 16px;
    background: linear-gradient(135deg, var(--pink-soft), var(--blue-soft));
    border-radius: 14px; margin-bottom: 18px;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .modal .email-detail-meta .row { display: flex; gap: 10px; align-items: flex-start; }
  .modal .email-detail-meta .label {
    color: var(--ink-soft); min-width: 60px;
    font-weight: 700; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .modal .email-detail-meta .value {
    color: var(--ink); word-break: break-all;
    flex: 1; line-height: 1.5;
  }
  .modal .email-detail-body {
    font-size: 14px; line-height: 1.8; white-space: pre-wrap;
    word-break: break-word; color: var(--ink);
    max-height: 420px; overflow-y: auto;
    padding: 18px;
    background: linear-gradient(135deg, #fafbfc, #f5f7fa);
    border-radius: 14px;
    border: 1px solid var(--line-soft);
  }
  .modal-actions {
    display: flex; gap: 9px; justify-content: flex-end;
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--line-soft);
  }

  /* ── Folder List ── */
  .folder-list { list-style: none; }
  .folder-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 17px; margin-bottom: 8px;
    background: var(--card-solid); border-radius: 13px;
    cursor: pointer; transition: all 0.2s;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .folder-item:hover {
    transform: translateX(3px);
    box-shadow: 0 4px 14px rgba(212,99,138,0.12);
    border-color: var(--line);
  }
  .folder-item .fname { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .folder-item .fcounts {
    display: flex; gap: 12px; font-size: 12px; color: var(--ink-soft);
  }
  .folder-item .fcounts .unread {
    color: var(--accent); font-weight: 700;
  }

  /* ── Catgirl Bubble ── */
  .catgirl-bubble {
    background: linear-gradient(135deg, rgba(255,228,236,0.85), rgba(230,244,249,0.85));
    border-radius: 18px; padding: 18px 22px 18px 56px;
    margin-bottom: 20px; font-size: 14px; line-height: 1.75;
    color: var(--ink); position: relative;
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 14px rgba(212,99,138,0.08);
  }
  .catgirl-bubble::before {
    content: '🐱'; position: absolute; top: -14px; left: 18px;
    font-size: 28px;
    filter: drop-shadow(0 3px 6px rgba(212,99,138,0.2));
  }
  .catgirl-bubble .bubble-text { font-style: italic; }

  /* ── Utilities ── */
  .hidden { display: none !important; }
  .text-center { text-align: center; }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .footer-info {
    font-size: 12px; color: var(--ink-soft); margin-top: 24px;
    text-align: center; letter-spacing: 0.3px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(212,99,138,0.25); border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(212,99,138,0.4); }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    body { padding: 16px 12px 40px; }
    .header { padding: 18px 18px 16px; }
    .header h1 { font-size: 22px; }
    .tab { padding: 8px 13px; font-size: 12px; }
    .stat .num { font-size: 28px; }
    .panel { padding: 18px; }
  }
</style>
</head>
<body>
<div class="container">

<!-- Header -->
<div class="header">
  <div class="header-top">
    <h1>
      <span class="emoji">📧</span>
      <span>猫娘邮件秘书</span>
      <span class="badge" id="emailBadge">--</span>
    </h1>
    <div class="header-actions">
      <button class="ghost tiny" onclick="loadSummary()">🔄 刷新摘要</button>
      <button class="ghost tiny" onclick="loadUnread()">📬 刷新未读</button>
    </div>
  </div>
  <div class="greeting" id="greeting">主人~让喵喵帮您管理邮件吧~ 喵呜~</div>
  <div class="status-bar">
    <span class="status-dot loading" id="statusDot"></span>
    <span id="statusText">连接中...</span>
  </div>
</div>

<!-- Tabs -->
<div class="tabs" id="tabs">
  <div class="tab active" data-tab="summary">📊 今日摘要</div>
  <div class="tab" data-tab="unread">📬 未读邮件 <span class="tab-count" id="unreadTabCount">--</span></div>
  <div class="tab" data-tab="folders">📁 文件夹</div>
  <div class="tab" data-tab="search">🔍 搜索</div>
  <div class="tab" data-tab="send">✉️ 发送</div>
</div>

<!-- ====== 今日摘要 ====== -->
<div class="tabpane" data-pane="summary">
  <div class="stats-grid" id="statsGrid">
    <div class="stat pink"><div class="num" id="statUnread">-</div><div class="lbl">未读邮件</div></div>
    <div class="stat blue"><div class="num" id="statToday">-</div><div class="lbl">今日邮件</div></div>
    <div class="stat warn"><div class="num" id="statHigh">-</div><div class="lbl">高优先级</div></div>
    <div class="stat good"><div class="num" id="statMedium">-</div><div class="lbl">普通邮件</div></div>
  </div>

  <div class="catgirl-bubble hidden" id="catgirlBubble">
    <div class="bubble-text" id="catgirlText"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>🔥 高优先级邮件</h3>
    </div>
    <ul class="email-list" id="highList">
      <li class="loading"><span class="spinner"></span></li>
    </ul>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>⭐ 普通邮件</h3>
      <span class="hint" id="mediumHint"></span>
    </div>
    <ul class="email-list" id="mediumList">
      <li class="loading"><span class="spinner"></span></li>
    </ul>
  </div>
</div>

<!-- ====== 未读邮件 ====== -->
<div class="tabpane hidden" data-pane="unread">
  <div class="panel">
    <div class="panel-head">
      <h3>📬 未读邮件 <span class="hint" id="unreadHint"></span></h3>
      <button class="ghost tiny" onclick="loadUnread()">🔄 刷新</button>
    </div>
    <div class="filter-bar" id="unreadFilter">
      <span class="filter-chip on" data-prio="">全部</span>
      <span class="filter-chip" data-prio="high">🔥 紧急</span>
      <span class="filter-chip" data-prio="medium">⭐ 一般</span>
      <span class="filter-chip" data-prio="low">🌿 普通</span>
    </div>
    <ul class="email-list" id="unreadList">
      <li class="loading"><span class="spinner"></span></li>
    </ul>
  </div>
</div>

<!-- ====== 文件夹 ====== -->
<div class="tabpane hidden" data-pane="folders">
  <div class="panel">
    <div class="panel-head">
      <h3>📁 邮箱文件夹</h3>
      <button class="ghost tiny" onclick="loadFolders()">🔄 刷新</button>
    </div>
    <ul class="folder-list" id="folderList">
      <li class="loading"><span class="spinner"></span></li>
    </ul>
  </div>
</div>

<!-- ====== 搜索 ====== -->
<div class="tabpane hidden" data-pane="search">
  <div class="panel">
    <div class="panel-head"><h3>🔍 搜索邮件</h3></div>
    <div class="form-group">
      <div style="display:flex;gap:10px;">
        <input type="text" id="searchInput" placeholder="输入关键词（主题/发件人/正文）..." style="flex:1;" onkeydown="if(event.key==='Enter')doSearch()" />
        <button onclick="doSearch()">搜索</button>
      </div>
    </div>
    <ul class="email-list" id="searchList"></ul>
  </div>
</div>

<!-- ====== 发送 ====== -->
<div class="tabpane hidden" data-pane="send">
  <div class="panel">
    <div class="panel-head"><h3>✉️ 发送邮件</h3></div>
    <div class="form-row">
      <div class="form-group">
        <label>收件人</label>
        <input type="email" id="sendTo" placeholder="example@qq.com" />
      </div>
    </div>
    <div class="form-group">
      <label>主题</label>
      <input type="text" id="sendSubject" placeholder="邮件主题" />
    </div>
    <div class="form-group">
      <label>正文</label>
      <textarea id="sendBody" placeholder="写点什么吧~"></textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="doSend()">📤 发送邮件</button>
    </div>
  </div>
</div>

<!-- Email Detail Modal -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="emailModal">
    <h3 id="modalTitle">邮件详情</h3>
    <div class="email-detail-meta" id="modalMeta"></div>
    <div class="email-detail-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="modalMarkRead()">✅ 标记已读</button>
      <button class="ghost" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="footer-info">
  数据来自 QQ 邮箱 · 猫娘邮件秘书 v0.1.0 · 喵呜~
</div>

</div>

<script>
const PLUGIN_ID = 'neko_mail';
let CURRENT_FILTER = '';
let CURRENT_MODAL_EMAIL = null;
let UNREAD_CACHE = [];

// ── API ──
async function callPlugin(entry, args) {
  try {
    const r = await fetch('/runs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({plugin_id: PLUGIN_ID, entry_id: entry, args: args || {}}),
    });
    if (!r.ok) return {ok: false, error: 'HTTP ' + r.status};
    const cd = await r.json();
    const runId = cd.run_id;
    if (!runId) return {ok: false, error: '未拿到 run_id'};
    for (let i = 0; i < 300; i++) {
      await new Promise(r => setTimeout(r, 200));
      const sr = await fetch('/runs/' + runId);
      if (!sr.ok) continue;
      const sd = await sr.json();
      if (sd.status === 'succeeded') {
        const er = await fetch('/runs/' + runId + '/export');
        if (er.ok) {
          try {
            const ed = await er.json();
            if (ed.items && ed.items.length > 0) {
              const ti = ed.items.find(x => x.label === 'trigger_response');
              if (ti && ti.json) {
                const j = ti.json;
                if (j && j.success) return {ok: true, value: j.data !== undefined ? j.data : null};
                const errObj = j && j.error || {};
                return {ok: false, error: String(errObj.message || errObj.code || '插件返回失败')};
              }
            }
          } catch (_) {}
        }
        return {ok: true, value: null};
      } else if (['failed','canceled','timeout'].includes(sd.status)) {
        const errObj = sd.error || {};
        return {ok: false, error: String(errObj.message || errObj.code || 'run ' + sd.status)};
      }
    }
    return {ok: false, error: '轮询超时(60s)'};
  } catch (e) {
    return {ok: false, error: String(e && e.message || e)};
  }
}

async function api(entry, args) {
  const result = await callPlugin(entry, args);
  if (!result.ok) { showToast(result.error, 'error'); throw new Error(result.error); }
  return result.value || {};
}

// ── UI Helpers ──
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function getInitial(name) {
  if (!name) return '?';
  const s = String(name).trim();
  if (/^[\u4e00-\u9fa5]/.test(s)) return s.charAt(0);
  return s.charAt(0).toUpperCase();
}

function renderEmail(e, showActions = false) {
  const p = e.priority || 'medium';
  const pLabel = {high:'🔥 紧急', medium:'⭐ 一般', low:'🌿 普通'}[p] || '⭐ 一般';
  const initial = getInitial(e.sender);
  const hasAtt = e.has_attachments || (e.attachments && e.attachments.length > 0);
  const attCount = hasAtt ? (e.attachments || []).length : 0;

  let html = '<li class="email-item ' + p + '" onclick="showEmailDetail(\'' + esc(e.uid) + '\')">';
  html += '<div class="avatar ' + p + '">' + esc(initial) + '</div>';
  html += '<div class="body">';
  html += '<div class="title">' + esc(e.subject || '(无主题)');
  if (hasAtt) html += ' <span class="tag attach">📎 ' + attCount + '</span>';
  html += '</div>';
  html += '<div class="meta">';
  html += '<span>📮 ' + esc(e.sender || '') + '</span>';
  html += '<span>🕐 ' + esc(e.time_str || '') + '</span>';
  html += '<span class="tag prio-' + p + '">' + pLabel + '</span>';
  html += '</div>';
  if (e.preview) html += '<div class="preview">' + esc(e.preview) + '</div>';
  html += '</div>';
  if (showActions) {
    html += '<div class="actions" onclick="event.stopPropagation()">';
    html += '<button class="ghost tiny" onclick="markRead(\'' + esc(e.uid) + '\', this)">✅ 已读</button>';
    html += '</div>';
  }
  html += '</li>';
  return html;
}

function renderEmailSmall(e) {
  const p = e.priority || 'medium';
  const pLabel = {high:'🔥 紧急', medium:'⭐ 一般', low:'🌿 普通'}[p] || '⭐ 一般';
  const initial = getInitial(e.sender);
  let html = '<li class="email-item ' + p + '" onclick="showEmailDetail(\'' + esc(e.uid) + '\')">';
  html += '<div class="avatar ' + p + '">' + esc(initial) + '</div>';
  html += '<div class="body">';
  html += '<div class="title">' + esc(e.subject || '(无主题)') + '</div>';
  html += '<div class="meta">';
  html += '<span>' + esc(e.sender || '') + '</span>';
  html += '<span>' + esc(e.time || '') + '</span>';
  html += '<span class="tag prio-' + p + '">' + pLabel + '</span>';
  html += '</div>';
  if (e.preview) html += '<div class="preview">' + esc(e.preview) + '</div>';
  html += '</div></li>';
  return html;
}

// ── Tab Switch ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.querySelectorAll('.tabpane').forEach(p => p.classList.add('hidden'));
    document.querySelector('[data-pane="' + name + '"]').classList.remove('hidden');
    if (name === 'summary') loadSummary();
    else if (name === 'unread') loadUnread();
    else if (name === 'folders') loadFolders();
  });
});

// ── Summary ──
async function loadSummary() {
  const highList = document.getElementById('highList');
  const mediumList = document.getElementById('mediumList');
  highList.innerHTML = '<li class="loading"><span class="spinner"></span></li>';
  mediumList.innerHTML = '<li class="loading"><span class="spinner"></span></li>';

  try {
    const data = await api('get_summary');
    document.getElementById('statUnread').textContent = data.total_unread ?? '-';
    document.getElementById('statToday').textContent = data.total_today ?? '-';
    document.getElementById('statHigh').textContent = (data.high_priority && data.high_priority.length) || 0;
    document.getElementById('statMedium').textContent = (data.medium_priority && data.medium_priority.length) || 0;
    document.getElementById('emailBadge').textContent = data.total_unread ?? '--';
    document.getElementById('unreadTabCount').textContent = data.total_unread ?? '--';

    if (data.catgirl_text) {
      document.getElementById('catgirlBubble').classList.remove('hidden');
      document.getElementById('catgirlText').textContent = data.catgirl_text;
    }

    if (data.high_priority && data.high_priority.length > 0) {
      highList.innerHTML = data.high_priority.map(e => renderEmailSmall(e)).join('');
    } else {
      highList.innerHTML = '<li class="empty"><span class="empty-icon">🎉</span>没有高优先级邮件喵~ 主人可以放心啦!</li>';
    }

    const meds = data.medium_priority || [];
    if (meds.length > 0) {
      mediumList.innerHTML = meds.slice(0, 10).map(e => renderEmailSmall(e)).join('');
      if (meds.length > 10) {
        document.getElementById('mediumHint').textContent = '显示前 10 封，共 ' + meds.length + ' 封';
      }
    } else {
      mediumList.innerHTML = '<li class="empty"><span class="empty-icon">📭</span>没有普通邮件~</li>';
    }

    setStatus('ok', '已连接');
    document.getElementById('greeting').textContent = '主人~喵喵已经帮您整理好邮件啦~ 喵呜~';
  } catch (e) {
    setStatus('error', '连接失败: ' + e.message);
    document.getElementById('greeting').textContent = '呜呜~连接失败了,请检查配置喵...';
    highList.innerHTML = '<li class="empty">❌ 加载失败</li>';
    mediumList.innerHTML = '<li class="empty">❌ 加载失败</li>';
  }
}

// ── Unread ──
async function loadUnread() {
  const list = document.getElementById('unreadList');
  list.innerHTML = '<li class="loading"><span class="spinner"></span></li>';
  document.getElementById('unreadHint').textContent = '加载中...';

  try {
    const data = await api('get_unread', {limit: 50});
    const emails = data.emails || [];
    UNREAD_CACHE = emails;
    document.getElementById('unreadHint').textContent = '共 ' + emails.length + ' 封未读';
    document.getElementById('unreadTabCount').textContent = emails.length;
    document.getElementById('emailBadge').textContent = emails.length;
    renderUnreadFilteredList();
  } catch (e) {
    document.getElementById('unreadHint').textContent = '加载失败';
    list.innerHTML = '<li class="empty"><span class="empty-icon">❌</span>加载失败: ' + esc(e.message) + '</li>';
  }
}

function renderUnreadFilteredList() {
  const list = document.getElementById('unreadList');
  let filtered = UNREAD_CACHE;
  if (CURRENT_FILTER) {
    filtered = filtered.filter(e => (e.priority || 'medium') === CURRENT_FILTER);
  }
  if (filtered.length > 0) {
    list.innerHTML = filtered.map(e => renderEmail(e, true)).join('');
  } else if (CURRENT_FILTER) {
    list.innerHTML = '<li class="empty"><span class="empty-icon">🔍</span>该分类下没有邮件~</li>';
  } else {
    list.innerHTML = '<li class="empty"><span class="empty-icon">📭</span>没有未读邮件~ 主人可以放心休息啦!</li>';
  }
}

document.querySelectorAll('#unreadFilter .filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#unreadFilter .filter-chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    CURRENT_FILTER = chip.dataset.prio;
    renderUnreadFilteredList();
  });
});

// ── Folders ──
async function loadFolders() {
  const list = document.getElementById('folderList');
  list.innerHTML = '<li class="loading"><span class="spinner"></span></li>';
  try {
    const data = await api('list_folders');
    const folders = data.folders || [];
    if (folders.length > 0) {
      list.innerHTML = folders.map(f => {
        return '<li class="folder-item" onclick="viewFolder(\'' + esc(f.name) + '\')">' +
          '<span class="fname">📁 ' + esc(f.name) + '</span>' +
          '<span class="fcounts">' +
          '<span class="unread">未读 ' + (f.unread_count || 0) + '</span>' +
          '<span>共 ' + (f.total_count || 0) + '</span>' +
          '</span></li>';
      }).join('');
    } else {
      list.innerHTML = '<li class="empty"><span class="empty-icon">📂</span>没有找到文件夹</li>';
    }
  } catch (e) {
    list.innerHTML = '<li class="empty">❌ 加载失败: ' + esc(e.message) + '</li>';
  }
}

async function viewFolder(folderName) {
  showToast('查看文件夹: ' + folderName);
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-tab="unread"]').classList.add('active');
  document.querySelectorAll('.tabpane').forEach(p => p.classList.add('hidden'));
  document.querySelector('[data-pane="unread"]').classList.remove('hidden');

  const list = document.getElementById('unreadList');
  list.innerHTML = '<li class="loading"><span class="spinner"></span></li>';
  document.getElementById('unreadHint').textContent = '加载中 ' + folderName + '...';

  try {
    const data = await api('get_unread', {folder: folderName, limit: 50});
    const emails = data.emails || [];
    UNREAD_CACHE = emails;
    document.getElementById('unreadHint').textContent = folderName + ' · 共 ' + emails.length + ' 封未读';
    renderUnreadFilteredList();
  } catch (e) {
    list.innerHTML = '<li class="empty">❌ 加载失败: ' + esc(e.message) + '</li>';
  }
}

// ── Search ──
async function doSearch() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) { showToast('请输入关键词', 'error'); return; }
  const list = document.getElementById('searchList');
  list.innerHTML = '<li class="loading"><span class="spinner"></span></li>';
  try {
    const data = await api('search', {keyword: kw, limit: 30});
    if (data.emails && data.emails.length > 0) {
      list.innerHTML = data.emails.map(e => renderEmail(e, false)).join('');
    } else {
      list.innerHTML = '<li class="empty"><span class="empty-icon">🔍</span>没有找到相关邮件~</li>';
    }
  } catch (e) {
    list.innerHTML = '<li class="empty">❌ 搜索失败: ' + esc(e.message) + '</li>';
  }
}

// ── Send ──
async function doSend() {
  const to = document.getElementById('sendTo').value.trim();
  const subject = document.getElementById('sendSubject').value.trim();
  const body = document.getElementById('sendBody').value.trim();
  if (!to || !subject || !body) { showToast('请填写完整信息', 'error'); return; }
  try {
    await api('send', {to, subject, body});
    showToast('✅ 发送成功喵~', 'success');
    document.getElementById('sendTo').value = '';
    document.getElementById('sendSubject').value = '';
    document.getElementById('sendBody').value = '';
  } catch (e) {}
}

// ── Mark Read ──
async function markRead(uid, btn) {
  try {
    await api('mark_read', {uid});
    showToast('✅ 已标记为已读', 'success');
    if (btn) {
      btn.closest('.email-item').style.opacity = '0.4';
      btn.disabled = true;
      btn.textContent = '✅ 已读';
    }
    UNREAD_CACHE = UNREAD_CACHE.filter(e => e.uid !== uid);
  } catch (e) {}
}

// ── Email Detail Modal ──
async function showEmailDetail(uid) {
  let emailData = UNREAD_CACHE.find(e => e.uid === uid);
  if (!emailData) {
    showToast('加载邮件详情...');
    return;
  }

  CURRENT_MODAL_EMAIL = emailData;
  const p = emailData.priority || 'medium';
  const pLabel = {high:'🔥 紧急', medium:'⭐ 一般', low:'🌿 普通'}[p] || '⭐ 一般';

  document.getElementById('modalTitle').textContent = emailData.subject || '(无主题)';

  let metaHtml = '';
  metaHtml += '<div class="row"><span class="label">发件人</span><span class="value">' + esc(emailData.sender || '') + '</span></div>';
  metaHtml += '<div class="row"><span class="label">收件人</span><span class="value">' + esc((emailData.recipients || []).join(', ')) + '</span></div>';
  if (emailData.cc && emailData.cc.length > 0) {
    metaHtml += '<div class="row"><span class="label">抄送</span><span class="value">' + esc(emailData.cc.join(', ')) + '</span></div>';
  }
  metaHtml += '<div class="row"><span class="label">时间</span><span class="value">' + esc(emailData.time_str || emailData.date || '') + '</span></div>';
  metaHtml += '<div class="row"><span class="label">优先级</span><span class="value"><span class="tag prio-' + p + '">' + pLabel + '</span></span></div>';
  if (emailData.has_attachments || (emailData.attachments && emailData.attachments.length > 0)) {
    const atts = emailData.attachments || [];
    metaHtml += '<div class="row"><span class="label">附件</span><span class="value">' +
      atts.map(a => esc(a.filename) + ' (' + (a.size_human || a.size || '?') + ')').join(', ') +
      '</span></div>';
  }
  document.getElementById('modalMeta').innerHTML = metaHtml;
  document.getElementById('modalBody').textContent = emailData.body_text || '(无正文)';
  document.getElementById('modalMask').classList.add('show');
}

function closeModal() {
  document.getElementById('modalMask').classList.remove('show');
  CURRENT_MODAL_EMAIL = null;
}

async function modalMarkRead() {
  if (!CURRENT_MODAL_EMAIL) return;
  await markRead(CURRENT_MODAL_EMAIL.uid);
  closeModal();
  renderUnreadFilteredList();
}

document.getElementById('modalMask').addEventListener('click', (e) => {
  if (e.target.id === 'modalMask') closeModal();
});

// ── Status ──
function setStatus(type, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (type === 'error' ? ' error' : type === 'loading' ? ' loading' : '');
  document.getElementById('statusText').textContent = text;
}

// ── Init ──
loadSummary();
</script>
</body>
</html>
