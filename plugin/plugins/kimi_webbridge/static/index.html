<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi WebBridge - 浏览器自动化</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-cat"></i>
                    <h1 data-i18n="app_title">Kimi WebBridge</h1>
                </div>
                <div class="language-selector">
                    <select id="languageSelect">
                        <option value="zh-CN">中文</option>
                        <option value="en-US">English</option>
                        <option value="ja-JP">日本語</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- 主要内容 -->
        <main class="main">
            <!-- 状态卡片 -->
            <section class="status-card">
                <div class="status-header">
                    <i class="fas fa-plug"></i>
                    <h2 data-i18n="connection_status">连接状态</h2>
                </div>
                <div class="status-content">
                    <div class="status-indicator" id="statusIndicator">
                        <span class="status-dot"></span>
                        <span class="status-text" data-i18n="checking">检查中...</span>
                    </div>
                    <button class="btn btn-refresh" id="refreshStatusBtn">
                        <i class="fas fa-sync-alt"></i>
                        <span data-i18n="refresh">刷新</span>
                    </button>
                </div>
            </section>

            <!-- 导航区域 -->
            <section class="navigation-section">
                <div class="section-header">
                    <i class="fas fa-globe"></i>
                    <h2 data-i18n="navigation">导航</h2>
                </div>
                <div class="navigation-form">
                    <div class="input-group">
                        <input type="url" id="urlInput" placeholder="https://example.com" required>
                        <button class="btn btn-primary" id="navigateBtn">
                            <i class="fas fa-arrow-right"></i>
                            <span data-i18n="go">前往</span>
                        </button>
                    </div>
                    <div class="options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="newTabCheckbox" checked>
                            <span data-i18n="new_tab">新标签页</span>
                        </label>
                        <input type="text" id="groupTitleInput" placeholder="标签组标题（可选）">
                    </div>
                </div>
            </section>

            <!-- 操作按钮区域 -->
            <section class="actions-section">
                <div class="section-header">
                    <i class="fas fa-tools"></i>
                    <h2 data-i18n="actions">操作</h2>
                </div>
                <div class="actions-grid">
                    <button class="action-btn" id="snapshotBtn">
                        <i class="fas fa-camera"></i>
                        <span data-i18n="snapshot">快照</span>
                    </button>
                    <button class="action-btn" id="screenshotBtn">
                        <i class="fas fa-image"></i>
                        <span data-i18n="screenshot">截图</span>
                    </button>
                    <button class="action-btn" id="listTabsBtn">
                        <i class="fas fa-list"></i>
                        <span data-i18n="list_tabs">标签页</span>
                    </button>
                    <button class="action-btn" id="closeSessionBtn">
                        <i class="fas fa-times"></i>
                        <span data-i18n="close_session">关闭会话</span>
                    </button>
                    <button class="action-btn" id="evaluateBtn">
                        <i class="fas fa-code"></i>
                        <span data-i18n="execute_js">执行JS</span>
                    </button>
                    <button class="action-btn" id="statusBtn">
                        <i class="fas fa-info-circle"></i>
                        <span data-i18n="status">状态</span>
                    </button>
                </div>
            </section>

            <!-- 结果显示区域 -->
            <section class="results-section">
                <div class="section-header">
                    <i class="fas fa-terminal"></i>
                    <h2 data-i18n="results">结果</h2>
                    <button class="btn btn-small" id="clearResultsBtn">
                        <i class="fas fa-trash"></i>
                        <span data-i18n="clear">清空</span>
                    </button>
                </div>
                <div class="results-container" id="resultsContainer">
                    <div class="welcome-message">
                        <i class="fas fa-sparkles"></i>
                        <p data-i18n="welcome_message">欢迎使用 Kimi WebBridge 浏览器自动化插件</p>
                        <p data-i18n="welcome_hint">选择操作开始探索网络世界吧~</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部 -->
        <footer class="footer">
            <p data-i18n="copyright">© 2026 Kimi WebBridge Plugin for N.E.K.O.</p>
            <p class="footer-hint" data-i18n="footer_hint">由 Kimi 提供技术支持</p>
            <a href="tutorial.html" class="tutorial-link" data-i18n="tutorial_link">📖 查看使用教程</a>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
